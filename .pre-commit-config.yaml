repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check src tests --fix
        language: system
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format src tests
        language: system
        pass_filenames: false

      - id: make-check
        name: make check
        entry: make check
        language: system
        pass_filenames: false
